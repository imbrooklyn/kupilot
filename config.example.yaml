# KuPilot accepts this typed version 1 schema. Interactive setup may add a
# plaintext model.api_key to the local KUPILOT_HOME/config.yaml file.
version: 1

context: development
namespace: default
no_color: false

model:
  provider_kind: openai_compatible
  endpoint: https://model.example.invalid/v1
  model: diagnostic-model
  temperature: 0.1
  max_output_tokens: 2048
  request_timeout_seconds: 45
  streaming: true
  tool_calling_required: true

kubernetes:
  exec_credentials: allow

logging:
  enabled: true
  level: info
