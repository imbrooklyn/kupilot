# Existing exact Deployment restart fixture; unrelated capabilities are not granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kupilot-deployment-restart
  namespace: example-namespace
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["example-deployment"]
    verbs: ["get", "patch"]
