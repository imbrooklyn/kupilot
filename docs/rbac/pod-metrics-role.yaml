# Optional v0.5 one-Pod metrics fixture. Replace both resourceNames together.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kupilot-pod-metrics
  namespace: replace-with-namespace
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["replace-with-pod-name"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    resourceNames: ["replace-with-pod-name"]
    verbs: ["get"]
